name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev
          pip install --upgrade pip buildozer "cython<3" virtualenv

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-

      - name: Download Xray for Android
        run: |
          # Используем конкретную версию, чтобы избежать проблем с тегом latest
          XRAY_VERSION="v1.8.8"

          # 64-битная версия (arm64-v8a)
          echo "Downloading Xray for arm64-v8a..."
          curl -fL -o xray64.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          unzip -o xray64.zip xray
          mv xray xray_arm64
          chmod +x xray_arm64

          # 32-битная версия (armeabi-v7a)
          echo "Downloading Xray for armeabi-v7a..."
          curl -fL -o xray32.zip "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm32-v7a.zip"
          unzip -o xray32.zip xray
          mv xray xray_arm32
          chmod +x xray_arm32

          # Проверяем, что оба файла на месте
          ls -lh xray_arm64 xray_arm32

      - name: Build
        run: |
          export JAVA_HOME="$JAVA_HOME_11_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME_17_X64" >> ~/.gradle/gradle.properties
          java -version
          buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: notesbot-apk
          path: bin/*.apk
